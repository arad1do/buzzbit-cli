name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Run live MCP smoke tests (requires MCP_TEST_KEY secret)'
        type: boolean
        default: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Link bbx globally
        run: npm link

      # Live tests only run when MCP_TEST_KEY is configured AND not explicitly
      # skipped via workflow_dispatch. The harness itself decides what to skip.
      - name: Verify (full)
        if: ${{ env.MCP_TEST_KEY != '' && (github.event_name != 'workflow_dispatch' || inputs.run_live) }}
        shell: bash
        env:
          MCP_TEST_KEY: ${{ secrets.MCP_TEST_KEY }}
        run: bash test/verify.sh --report=$RUNNER_TEMP/bbx-verification.md

      - name: Verify (offline only)
        if: ${{ env.MCP_TEST_KEY == '' || (github.event_name == 'workflow_dispatch' && !inputs.run_live) }}
        shell: bash
        env:
          MCP_TEST_KEY: ${{ secrets.MCP_TEST_KEY }}
        run: bash test/verify.sh --skip-live --skip-coverage --report=$RUNNER_TEMP/bbx-verification.md

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbx-verification-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            ${{ runner.temp }}/bbx-verification.md
            ${{ runner.temp }}/bbx-verification.logs/
          retention-days: 14
